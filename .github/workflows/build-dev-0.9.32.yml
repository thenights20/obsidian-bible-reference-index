name: Aplicar ajustes dev 0.9.32

on:
  push:
    branches:
      - dev
    paths:
      - "tools/apply-dev-0.9.32.mjs"
      - ".github/workflows/build-dev-0.9.32.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Aplicar patch no plugin compilado
        run: node tools/apply-dev-0.9.32.mjs

      - name: Validar JavaScript
        run: node --check main.js

      - name: Validar remoção dos links JW Library
        shell: bash
        run: |
          if grep -Eq 'VersePreviewModal|linkBibleReferences|jwlibrary:///|registerObsidianProtocolHandler\("indice-nights-bible"|scriptureObserver' main.js; then
            echo "Ainda existem rotinas antigas de link bíblico/JW Library em main.js"
            exit 1
          fi

      - name: Commitar resultado na dev
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.js styles.css manifest.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commitar."
            exit 0
          fi
          git commit -m "v0.9.32: corrige salto para parágrafo e remove links JW Library"
          git push origin dev
